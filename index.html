<!DOCTYPE html>
<html lang="zh" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>充电站实时监控</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="page">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true"></div>
                <div class="brand-text">
                    <h1 id="title">信息工程院充电桩</h1>
                    <p id="subtitle">端口空闲状态 · 每 10 秒自动刷新</p>
                </div>
            </div>

            <div class="topbar-right">
                <span class="pill" id="source-pill" title="数据来源">
                    <i class="dot"></i><span id="source-text">连接中</span>
                </span>
                <span class="updated" title="最后更新时间"><span id="updated-at">--:--:--</span></span>
                <button id="refresh-btn" class="icon-btn" title="立即刷新" aria-label="立即刷新">
                    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round">
                        <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                        <path d="M21 3v6h-6" />
                    </svg>
                </button>
                <button id="theme-btn" class="icon-btn" title="切换主题" aria-label="切换主题">
                    <svg class="i-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round">
                        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                    </svg>
                    <svg class="i-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round">
                        <circle cx="12" cy="12" r="4.2" />
                        <path
                            d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4" />
                    </svg>
                </button>
            </div>
        </header>

        <div class="notice" id="notice">
            <span class="notice-icon">⏳</span>
            <span class="notice-text">首次打开需要载入缓存，约需 30 秒，请耐心等待；之后每 10 秒自动刷新一次</span>
        </div>

        <section class="stats" aria-label="总览">
            <div class="stat">
                <span class="stat-value free" id="stat-free">–</span>
                <span class="stat-label">空闲端口</span>
            </div>
            <div class="stat">
                <span class="stat-value busy" id="stat-busy">–</span>
                <span class="stat-label">使用中</span>
            </div>
            <div class="stat">
                <span class="stat-value offline" id="stat-offline">–</span>
                <span class="stat-label">离线/故障</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="stat-stations">–</span>
                <span class="stat-label">站点在线</span>
            </div>
            <div class="legend">
                <span class="legend-item"><i class="chip free"></i>空闲</span>
                <span class="legend-item"><i class="chip busy"></i>使用中</span>
                <span class="legend-item"><i class="chip offline"></i>离线/故障</span>
            </div>
        </section>

        <main id="stations" class="grid" aria-live="polite"></main>

        <footer class="footer">
            <p class="footer-mail">
                管理员：柳淼 &nbsp;·&nbsp; 联系我：<a href="mailto:2952832309@qq.com">2952832309@qq.com</a>
            </p>
            <p>数据来源：一充云平台 · 仅展示端口占用状态，不涉及任何账户信息</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
